name: Daily insider report

on:
  schedule:
    # 02:30 UTC Tue-Sat: after EDGAR's 10pm ET cutoff for the previous business day.
    - cron: "30 2 * * 2-6"
    # 13:00 UTC Mon-Fri: morning catch-up for late index updates.
    - cron: "0 13 * * 1-5"
  # Senate trades arrive from a home PC (senate.py); rebuild when they do.
  push:
    branches: [main]
    paths: ["data/senate.json"]
  workflow_dispatch:
    inputs:
      days:
        description: "Calendar days to (re)collect"
        default: "14"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore database
        uses: actions/cache/restore@v4
        with:
          path: insider.db
          key: insider-db-${{ github.run_id }}
          restore-keys: insider-db-
      - name: Collect SEC filings
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          INSIDER_DB: ${{ github.workspace }}/insider.db
        run: python collector.py --days ${{ github.event.inputs.days || '14' }}
      - name: Collect House stock trades
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          INSIDER_DB: ${{ github.workspace }}/insider.db
        run: |
          pip install --quiet pdfplumber
          python congress.py
      - name: Collect committee assignments, meetings and industries
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
          INSIDER_DB: ${{ github.workspace }}/insider.db
        run: |
          pip install --quiet pyyaml
          python committees.py
      - name: Collect campaign donations from insiders to members (FEC)
        # Donations are extra context: never let this step stop the report.
        continue-on-error: true
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          FEC_API_KEY: ${{ secrets.FEC_API_KEY }}
          INSIDER_DB: ${{ github.workspace }}/insider.db
        run: python fec.py
      - name: Collect significant federal rules and sector fund prices
        # The Rules tab is extra context: never let this step stop the report.
        continue-on-error: true
        env:
          INSIDER_DB: ${{ github.workspace }}/insider.db
        run: python rules.py --years 5
      - name: Save database
        if: always()
        uses: actions/cache/save@v4
        with:
          path: insider.db
          key: insider-db-${{ github.run_id }}
      - name: Build site
        env:
          INSIDER_DB: ${{ github.workspace }}/insider.db
        run: python report.py --days 65
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
