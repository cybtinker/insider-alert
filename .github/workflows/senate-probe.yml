name: Senate access check (temporary)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check whether the Senate eFD site answers from GitHub
        env:
          UA: ${{ secrets.SEC_USER_AGENT }}
        run: |
          python - <<'PY'
          import os, re, json, urllib.parse, urllib.request, http.cookiejar
          cj = http.cookiejar.CookieJar()
          op = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(cj))
          op.addheaders = [("User-Agent", os.environ["UA"]), ("Accept", "*/*")]
          B = "https://efdsearch.senate.gov"
          h = op.open(B + "/search/home/").read().decode()
          tok = re.search(r'name="csrfmiddlewaretoken" value="([^"]+)"', h).group(1)
          r = op.open(urllib.request.Request(B + "/search/home/", data=urllib.parse.urlencode({"prohibition_agreement": "1", "csrfmiddlewaretoken": tok}).encode(), headers={"Referer": B + "/search/home/"}))
          print("agreement ->", r.status, r.geturl())
          csrf = [c.value for c in cj if c.name == "csrftoken"][0]
          data = {"start": "0", "length": "5", "report_types": "[11]", "filer_types": "[]", "submitted_start_date": "10/01/2026 00:00:00", "submitted_end_date": "", "candidate_state": "", "senator_state": "", "office_id": "", "first_name": "", "last_name": "", "csrfmiddlewaretoken": csrf}
          r = op.open(urllib.request.Request(B + "/search/report/data/", data=urllib.parse.urlencode(data).encode(), headers={"Referer": B + "/search/", "X-CSRFToken": csrf}))
          j = json.loads(r.read())
          print("total PTRs since Oct 1:", j["recordsTotal"])
          print(json.dumps(j["data"][:3])[:900])
          link = [re.search(r'href="([^"]+)"', d[3]).group(1) for d in j["data"] if "/ptr/" in d[3]][0]
          pg = op.open(B + link).read().decode()
          i = pg.find("<table")
          print(re.sub(r"\s+", " ", pg[i:i + 3000]))
          PY
